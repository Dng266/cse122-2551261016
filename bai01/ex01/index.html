    <title>Bài thơ Bốn Mùa</title>
</head>
<body>
    <table border="1" bordercolor="#9E9E9E" bgcolor="#FFFDE7" width="640" cellpadding="24" cellspacing="0" align="center">
        <tr>
            <td align="center">
                <table border="0" bgcolor="#FFD9E6" width="100%" cellpadding="6" cellspacing="0">
                    <tr>
                        <td align="center">
                            <font color="#D40000" size="6">
                                <b>BỐN MÙA</b>
                            </font>
                        </td>
                    </tr>
                </table>
                <font color="#0033CC" size="4">
                    <br><i>Xuân về hoa nở khắp trời</i><br>
                    <i>Hạ sang nắng cháy rạng ngời phố quen</i><br>
                    <i>Thu về lá rụng bên thềm</i><br><p></p>
                </font>
                <hr width="55%" size="1" color="#0033CC">
                <font color="#D40000" size="4">
                    <br><i>Đông sang gió lạnh bên em đợi chờ</i><br>
                    <i>Bốn mùa là bốn giấc mơ</i><br>
                    <i>Thời gian đi mãi ta chờ đợi ai</i><br><p></p>
                </font>
                <hr width="55%" size="1" color="#0033CC">
                <font color="#0033CC" size="4">
                    <br><i>Một năm rồi lại một năm</i><br>
                    <i>Vẫn còn câu hát thì thầm quê hương</i><br>
                    <i>Chờ xuân nắng mới soi đường</i>
                </font>
            </td>
        </tr>
